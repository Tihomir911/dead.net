
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1900" height="1550"
     viewBox="0 0 1900 1550">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>

    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff424c"/>
      <stop offset="100%" stop-color="#a90019"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff273d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff273d" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <style>
      .heading { font-family: Arial, sans-serif; font-weight: 700; fill: #f5f5f7; }
      .body { font-family: Arial, sans-serif; fill: #b5b5bd; }
      .muted { font-family: Arial, sans-serif; fill: #707079; }
      .redtext { font-family: Arial, sans-serif; fill: #ff3548; font-weight: 700; }
      .panel { fill: url(#panel); stroke: #303037; stroke-width: 1.5; }
      .line { stroke: #33333b; stroke-width: 1; }
      .accent { stroke: #ff3548; stroke-width: 2; fill: none; }
      .screen { fill: #0d0d11; stroke: #414149; stroke-width: 2; }
      .small { font-family: Arial, sans-serif; font-size: 11px; fill: #777780; }
    </style>
  </defs>

  <!-- CANVAS -->
  <rect width="1900" height="1550" fill="url(#bg)"/>

  <!-- BACKGROUND DECORATION -->
  <circle cx="1600" cy="150" r="300" fill="#ff1835" opacity="0.035" filter="url(#shadow)"/>
  <circle cx="200" cy="1200" r="250" fill="#ff1835" opacity="0.025" filter="url(#shadow)"/>

  <!-- HEADER -->
  <text x="80" y="75" class="heading" font-size="38">DEAD<tspan fill="#ff3548">.</tspan>NET</text>
  <text x="80" y="105" class="muted" font-size="13" letter-spacing="4">NETWORK INTELLIGENCE SYSTEM</text>

  <text x="1815" y="72" class="redtext" font-size="13" text-anchor="end">UI CONCEPT / 2026</text>
  <text x="1815" y="98" class="muted" font-size="12" text-anchor="end">MOBILE APPLICATION</text>

  <path d="M80 135 H1820" class="line"/>

  <!-- SECTION TITLE -->
  <text x="80" y="190" class="heading" font-size="22">01 / APPLICATION SCREENS</text>
  <text x="80" y="215" class="muted" font-size="12">PRIMARY USER EXPERIENCE</text>

  <!-- PHONE 1 -->
  <g transform="translate(80 255)">
    <rect width="300" height="610" rx="32" class="screen"/>
    <rect x="110" y="10" width="80" height="5" rx="3" fill="#414149"/>

    <text x="24" y="55" class="heading" font-size="20">DEAD<tspan fill="#ff3548">.</tspan>NET</text>
    <circle cx="265" cy="45" r="5" fill="#ff3548"/>
    <text x="24" y="83" class="muted" font-size="10" letter-spacing="2">NETWORK STATUS</text>

    <rect x="20" y="105" width="260" height="210" rx="18" class="panel"/>
    <circle cx="150" cy="200" r="68" fill="none" stroke="#292930" stroke-width="10"/>
    <circle cx="150" cy="200" r="68" fill="none" stroke="#ff3548"
            stroke-width="10" stroke-dasharray="355 427"
            stroke-linecap="round" transform="rotate(-90 150 200)"/>

    <text x="150" y="194" class="heading" font-size="40" text-anchor="middle">87</text>
    <text x="150" y="218" class="muted" font-size="10" text-anchor="middle">NETWORK SCORE</text>
    <text x="150" y="289" class="redtext" font-size="12" text-anchor="middle">EXCELLENT CONNECTION</text>

    <text x="24" y="350" class="heading" font-size="15">LIVE METRICS</text>

    <rect x="20" y="365" width="125" height="75" rx="12" class="panel"/>
    <text x="35" y="388" class="muted" font-size="10">PING</text>
    <text x="35" y="421" class="heading" font-size="25">24 <tspan font-size="12" fill="#777780">ms</tspan></text>

    <rect x="155" y="365" width="125" height="75" rx="12" class="panel"/>
    <text x="170" y="388" class="muted" font-size="10">JITTER</text>
    <text x="170" y="421" class="heading" font-size="25">3.2 <tspan font-size="12" fill="#777780">ms</tspan></text>

    <rect x="20" y="450" width="125" height="75" rx="12" class="panel"/>
    <text x="35" y="473" class="muted" font-size="10">DOWNLOAD</text>
    <text x="35" y="506" class="heading" font-size="22">94 <tspan font-size="11" fill="#777780">Mbps</tspan></text>

    <rect x="155" y="450" width="125" height="75" rx="12" class="panel"/>
    <text x="170" y="473" class="muted" font-size="10">UPLOAD</text>
    <text x="170" y="506" class="heading" font-size="22">42 <tspan font-size="11" fill="#777780">Mbps</tspan></text>

    <rect x="20" y="540" width="260" height="45" rx="12" fill="url(#red)"/>
    <text x="150" y="568" font-family="Arial" font-size="13" font-weight="700"
          fill="#ffffff" text-anchor="middle">START MEASUREMENT</text>
  </g>

  <!-- PHONE 2 -->
  <g transform="translate(420 255)">
    <rect width="300" height="610" rx="32" class="screen"/>
    <rect x="110" y="10" width="80" height="5" rx="3" fill="#414149"/>

    <text x="24" y="55" class="heading" font-size="20">NETWORK MAP</text>
    <text x="24" y="80" class="muted" font-size="10" letter-spacing="2">SIGNAL DISTRIBUTION</text>

    <rect x="18" y="105" width="264" height="350" rx="16" fill="#15191a" stroke="#303037"/>

    <!-- MAP GRID -->
    <path d="M30 160 L270 160 M30 220 L270 220 M30 280 L270 280 M30 340 L270 340 M30 400 L270 400"
          stroke="#30383a" stroke-width="2"/>
    <path d="M70 115 L70 445 M130 115 L130 445 M190 115 L190 445 M250 115 L250 445"
          stroke="#30383a" stroke-width="2"/>

    <path d="M35 390 L85 330 L125 350 L175 270 L225 250 L270 170"
          stroke="#62676a" stroke-width="8" fill="none"/>
    <path d="M35 390 L85 330 L125 350 L175 270 L225 250 L270 170"
          stroke="#9a9ca0" stroke-width="2" fill="none"/>

    <circle cx="100" cy="230" r="65" fill="#ff3548" opacity="0.09"/>
    <circle cx="100" cy="230" r="35" fill="#ff3548" opacity="0.13"/>
    <circle cx="100" cy="230" r="7" fill="#ff3548"/>

    <circle cx="210" cy="340" r="60" fill="#ff3548" opacity="0.08"/>
    <circle cx="210" cy="340" r="30" fill="#ff3548" opacity="0.13"/>
    <circle cx="210" cy="340" r="7" fill="#ff3548"/>

    <circle cx="205" cy="190" r="7" fill="#56d68b"/>
    <circle cx="65" cy="350" r="7" fill="#56d68b"/>

    <rect x="35" y="120" width="125" height="30" rx="8" fill="#222228"/>
    <text x="47" y="139" class="body" font-size="10">CURRENT LOCATION</text>

    <text x="24" y="490" class="heading" font-size="15">COVERAGE STATUS</text>

    <circle cx="35" cy="520" r="5" fill="#56d68b"/>
    <text x="50" y="524" class="body" font-size="11">Stable signal</text>

    <circle cx="35" cy="550" r="5" fill="#ff3548"/>
    <text x="50" y="554" class="body" font-size="11">Weak signal area</text>

    <circle cx="35" cy="580" r="5" fill="#777780"/>
    <text x="50" y="584" class="body" font-size="11">No measurements</text>
  </g>

  <!-- PHONE 3 -->
  <g transform="translate(760 255)">
    <rect width="300" height="610" rx="32" class="screen"/>
    <rect x="110" y="10" width="80" height="5" rx="3" fill="#414149"/>

    <text x="24" y="55" class="heading" font-size="20">HISTORY</text>
    <text x="24" y="80" class="muted" font-size="10" letter-spacing="2">RECENT MEASUREMENTS</text>

    <rect x="20" y="105" width="260" height="120" rx="16" class="panel"/>
    <text x="35" y="132" class="muted" font-size="10">NETWORK QUALITY / 24H</text>
    <path d="M35 190 L65 175 L95 182 L125 150 L155 165 L185 140 L215 155 L265 125"
