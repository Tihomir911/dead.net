    <text x="24" y="260" class="heading" font-size="15">RECENT ACTIVITY</text>

    <rect x="20" y="280" width="260" height="80" rx="12" class="panel"/>
    <circle cx="43" cy="320" r="7" fill="#56d68b"/>
    <text x="62" y="310" class="heading" font-size="13">Excellent connection</text>
    <text x="62" y="333" class="muted" font-size="10">Today, 13:42</text>
    <text x="250" y="322" class="redtext" font-size="12" text-anchor="end">24 ms</text>

    <rect x="20" y="375" width="260" height="80" rx="12" class="panel"/>
    <circle cx="43" cy="415" r="7" fill="#e8ae52"/>
    <text x="62" y="405" class="heading" font-size="13">Fair connection</text>
    <text x="62" y="428" class="muted" font-size="10">Today, 12:15</text>
    <text x="250" y="417" class="redtext" font-size="12" text-anchor="end">126 ms</text>

    <rect x="20" y="470" width="260" height="80" rx="12" class="panel"/>
    <circle cx="43" cy="510" r="7" fill="#ff3548"/>
    <text x="62" y="500" class="heading" font-size="13">Poor connection</text>
    <text x="62" y="523" class="muted" font-size="10">Today, 10:08</text>
    <text x="250" y="512" class="redtext" font-size="12" text-anchor="end">340 ms</text>

    <text x="150" y="585" class="muted" font-size="10" text-anchor="middle">VIEW FULL HISTORY →</text>
  </g>

  <!-- PHONE 4 -->
  <g transform="translate(1100 255)">
    <rect width="300" height="610" rx="32" class="screen"/>
    <rect x="110" y="10" width="80" height="5" rx="3" fill="#414149"/>

    <text x="24" y="55" class="heading" font-size="20">MEASUREMENT</text>
    <text x="24" y="80" class="muted" font-size="10" letter-spacing="2">DETAILED ANALYSIS</text>

    <rect x="20" y="105" width="260" height="100" rx="16" class="panel"/>
    <text x="35" y="135" class="muted" font-size="10">OVERALL QUALITY</text>
    <text x="35" y="180" class="redtext" font-size="30">EXCELLENT</text>

    <text x="24" y="245" class="heading" font-size="15">PERFORMANCE</text>

    <text x="25" y="285" class="body" font-size="12">Latency</text>
    <text x="275" y="285" class="heading" font-size="12" text-anchor="end">24 ms</text>
    <rect x="25" y="298" width="250" height="7" rx="4" fill="#292930"/>
    <rect x="25" y="298" width="42" height="7" rx="4" fill="#ff3548"/>

    <text x="25" y="345" class="body" font-size="12">Jitter</text>
    <text x="275" y="345" class="heading" font-size="12" text-anchor="end">3.2 ms</text>
    <rect x="25" y="358" width="250" height="7" rx="4" fill="#292930"/>
    <rect x="25" y="358" width="25" height="7" rx="4" fill="#ff3548"/>

    <text x="25" y="405" class="body" font-size="12">Packet loss</text>
    <text x="275" y="405" class="heading" font-size="12" text-anchor="end">0.0%</text>
    <rect x="25" y="418" width="250" height="7" rx="4" fill="#292930"/>
    <rect x="25" y="418" width="4" height="7" rx="4" fill="#ff3548"/>

    <text x="24" y="475" class="heading" font-size="15">CONNECTION INFO</text>

    <rect x="20" y="490" width="260" height="85" rx="12" class="panel"/>
    <text x="35" y="516" class="muted" font-size="10">INTERFACE</text>
    <text x="265" y="516" class="heading" font-size="11" text-anchor="end">Wi-Fi</text>
    <path d="M35 530 H265" class="line"/>
    <text x="35" y="555" class="muted" font-size="10">STATUS</text>
    <text x="265" y="555" class="redtext" font-size="11" text-anchor="end">CONNECTED</text>
  </g>

  <!-- PHONE 5 -->
  <g transform="translate(1440 255)">
    <rect width="300" height="610" rx="32" class="screen"/>
    <rect x="110" y="10" width="80" height="5" rx="3" fill="#414149"/>

    <text x="24" y="55" class="heading" font-size="20">SETTINGS</text>
    <text x="24" y="80" class="muted" font-size="10" letter-spacing="2">APPLICATION PREFERENCES</text>

    <text x="24" y="130" class="redtext" font-size="11">MEASUREMENTS</text>

    <rect x="20" y="145" width="260" height="75" rx="12" class="panel"/>
    <text x="35" y="175" class="heading" font-size="13">Background monitoring</text>
    <text x="35" y="197" class="muted" font-size="10">Automatic network checks</text>
    <rect x="232" y="168" width="30" height="16" rx="8" fill="#ff3548"/>
    <circle cx="253" cy="176" r="6" fill="#ffffff"/>

    <rect x="20" y="230" width="260" height="75" rx="12" class="panel"/>
    <text x="35" y="260" class="heading" font-size="13">Measurement interval</text>
    <text x="35" y="282" class="muted" font-size="10">Every 15 minutes</text>
    <text x="260" y="274" class="redtext" font-size="18" text-anchor="end">›</text>

    <text x="24" y="350" class="redtext" font-size="11">APPEARANCE</text>

    <rect x="20" y="365" width="260" height="65" rx="12" class="panel"/>
    <text x="35" y="403" class="heading" font-size="13">Dark interface</text>
    <circle cx="252" cy="397" r="10" fill="#ff3548"/>

    <text x="24" y="475" class="redtext" font-size="11">SYSTEM</text>

    <rect x="20" y="490" width="260" height="65" rx="12" class="panel"/>
    <text x="35" y="528" class="heading" font-size="13">About DEAD.NET</text>
    <text x="260" y="528" class="muted" font-size="18" text-anchor="end">›</text>

    <text x="150" y="585" class="muted" font-size="10" text-anchor="middle">VERSION 0.1.0 / LOCAL MODE</text>
  </g>

  <!-- FLOW SECTION -->
  <path d="M80 920 H1820" class="line"/>
  <text x="80" y="975" class="heading" font-size="22">02 / USER FLOW</text>
  <text x="80" y="1000" class="muted" font-size="12">SCREEN TRANSITIONS AND NAVIGATION LOGIC</text>

  <!-- FLOW NODES -->
  <g>
    <rect x="100" y="1060" width="240" height="115" rx="16" class="panel"/>
    <text x="220" y="1095" class="redtext" font-size="11" text-anchor="middle">01 / HOME</text>
    <text x="220" y="1130" class="heading" font-size="17" text-anchor="middle">Dashboard</text>
    <text x="220" y="1150" class="muted" font-size="10" text-anchor="middle">Network overview</text>

    <rect x="470" y="1060" width="240" height="115" rx="16" class="panel"/>
    <text x="590" y="1095" class="redtext" font-size="11" text-anchor="middle">02 / MAP</text>
    <text x="590" y="1130" class="heading" font-size="17" text-anchor="middle">Network map</text>
    <text x="590" y="1150" class="muted" font-size="10" text-anchor="middle">Signal distribution</text>

    <rect x="840" y="1060" width="240" height="115" rx="16" class="panel"/>
    <text x="960" y="1095" class="redtext" font-size="11" text-anchor="middle">03 / HISTORY</text>
    <text x="960" y="1130" class="heading" font-size="17" text-anchor="middle">Measurements</text>
    <text x="960" y="1150" class="muted" font-size="10" text-anchor="middle">Past performance</text>

    <rect x="1210" y="1060" width="240" height="115" rx="16" class="panel"/>
    <text x="1330" y="1095" class="redtext" font-size="11" text-anchor="middle">04 / DETAILS</text>
    <text x="1330" y="1130" class="heading" font-size="17" text-anchor="middle">Analysis</text>
    <text x="1330" y="1150" class="muted" font-size="10" text-anchor="middle">Measurement details</text>

    <rect x="1580" y="1060" width="240" height="115" rx="16" class="panel"/>
    <text x="1700" y="1095" class="redtext" font-size="11" text-anchor="middle">05 / SETTINGS</text>
    <text x="1700" y="1130" class="heading" font-size="17" text-anchor="middle">Preferences</text>
    <text x="1700" y="1150" class="muted" font-size="10" text-anchor="middle">Application settings</text>

    <!-- FLOW ARROWS -->
    <path d="M340 1117 H465 M710 1117 H835 M1080 1117 H1205 M1450 1117 H1575"
          stroke="#ff3548" stroke-width="2" fill="none"/>
    <path d="M455 1110 L465 1117 L455 1124 M825 1110 L835 1117 L825 1124
             M1195 1110 L1205 1117 L1195 1124
             M1565 1110 L1575 1117 L1565 1124"
          stroke="#ff3548" stroke-width="2" fill="none"/>

    <path d="M220 1175 V1240 H1700 V1175"
          stroke="#62626b" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
    <text x="960" y="1260" class="muted" font-size="11" text-anchor="middle">
      GLOBAL NAVIGATION / ACCESSIBLE FROM MAIN INTERFACE
    </text>
  </g>

  <!-- FOOTER -->
  <path d="M80 1320 H1820" class="line"/>
  <text x="80" y="1365" class="heading" font-size="17">DEAD<tspan fill="#ff3548">.</tspan>NET</text>
  <text x="80" y="1390" class="muted" font-size="10" letter-spacing="2">MONITOR YOUR CONNECTION. UNDERSTAND YOUR NETWORK.</text>

  <text x="1820" y="1365" class="redtext" font-size="12" text-anchor="end">DESIGN SYSTEM / 001</text>
  <text x="1820" y="1390" class="muted" font-size="10" text-anchor="end">BLACK / RED / GRAPHITE</text>

</svg>
